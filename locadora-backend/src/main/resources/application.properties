spring.application.name=locadora-backend

# A API fica em http://localhost:8080/locadora/resources/...
server.servlet.context-path=/locadora

# Conexão com o PostgreSQL (banco "locadora", o mesmo que aparece no pgAdmin).
# Usuário e senha vêm das variáveis de ambiente DB_USERNAME e DB_PASSWORD;
# se não existirem, usa o valor depois dos dois-pontos (usuário "postgres", senha vazia).
spring.datasource.url=jdbc:postgresql://localhost:5432/locadora
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# O Hibernate cria e atualiza as tabelas a partir das entidades, sem apagar os dados.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger em http://localhost:8080/locadora/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
