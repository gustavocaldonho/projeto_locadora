spring.application.name=locadora-backend

# A API fica em http://localhost:8080/locadora/resources/...
server.servlet.context-path=/locadora

# Banco H2 em memória (zera a cada reinício e é recarregado pelo data.sql)
spring.datasource.url=jdbc:h2:mem:locadora
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Swagger em http://localhost:8080/locadora/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
