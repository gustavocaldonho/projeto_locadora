# Os testes automáticos usam um banco H2 em memória, para não mexer no PostgreSQL.
server.servlet.context-path=/locadora
spring.datasource.url=jdbc:h2:mem:locadora-teste
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
