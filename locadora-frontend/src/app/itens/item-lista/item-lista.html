<div class="cabecalho">
  <h1>Itens</h1>
  <a mat-flat-button routerLink="novo">
    <mat-icon>add</mat-icon>
    Novo item
  </a>
</div>

<mat-form-field appearance="outline" class="filtro">
  <mat-label>Filtrar</mat-label>
  <mat-icon matPrefix>search</mat-icon>
  <input matInput (keyup)="filtrar($event)" />
</mat-form-field>

<mat-card appearance="outlined">
  <div class="tabela-container">
    <table mat-table [dataSource]="dados" matSort>

      <ng-container matColumnDef="numSerie">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nº de série</th>
        <td mat-cell *matCellDef="let x">{{ x.numSerie }}</td>
      </ng-container>

      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Título</th>
        <td mat-cell *matCellDef="let x">{{ x.titulo.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="tipoItem">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
        <td mat-cell *matCellDef="let x">{{ descricaoTipo(x.tipoItem) }}</td>
      </ng-container>

      <ng-container matColumnDef="dtAquisicao">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Aquisição</th>
        <td mat-cell *matCellDef="let x">{{ x.dtAquisicao | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef class="coluna-acoes"></th>
        <td mat-cell *matCellDef="let x" class="coluna-acoes">
          <a mat-icon-button [routerLink]="[x.id]" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="excluir(x)" matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="vazio" [attr.colspan]="colunas.length">
          {{ carregando ? 'Carregando...' : 'Nenhum registro encontrado.' }}
        </td>
      </tr>
    </table>
  </div>
</mat-card>
