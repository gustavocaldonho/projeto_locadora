<h1>Controle de Acervo</h1>
<p class="subtitulo">Escolha um cadastro para começar.</p>

<div class="grade">
  @for (c of cadastros; track c.rota) {
    <mat-card appearance="outlined" class="cartao" [routerLink]="c.rota">
      <mat-card-header>
        <mat-icon mat-card-avatar>{{ c.icone }}</mat-icon>
        <mat-card-title>{{ c.nome }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>{{ c.descricao }}</mat-card-content>
    </mat-card>
  }
</div>
